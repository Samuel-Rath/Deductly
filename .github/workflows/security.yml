name: Security Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Monday at 9am UTC
    - cron: '0 9 * * 1'

# Opt the JS-based actions into Node 24 — Node 20 is deprecated on
# GitHub-hosted runners and emits a warning every run without this.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      # Fails the job on any known vulnerability in the installed packages
      # (PyPI/OSV advisory data). Safety was removed: its `safety check`
      # command is deprecated, it crashed before scanning anything, and it
      # pinned filelock<4, which carries 13 advisories of its own.
      - name: Run pip-audit (vulnerability scan)
        run: |
          cd backend
          pip-audit --desc

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # TruffleHog walks git history, so it needs every commit, not a shallow clone.
          fetch-depth: 0

      # No base/head inputs on purpose: the action then picks the range from
      # the event (the pushed commits on push, the PR's commits on
      # pull_request, the whole history on the weekly schedule). Passing
      # base=main/head=HEAD made them identical on every push to main, so
      # nothing was ever scanned.
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          path: ./
          version: 3.99.7
          # Fail only on credentials TruffleHog confirmed are live.
          extra_args: --results=verified

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      # Fails on high/critical advisories in installed packages; moderate and
      # low ones are still listed in the log. Dependencies were brought to 0
      # known vulnerabilities in Nov 2026, so a failure here means a new one.
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      matrix:
        language: [ 'python', 'javascript' ]
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
