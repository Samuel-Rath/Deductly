name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when new commits land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All actions below are on versions that target Node 24 natively. This flag
# stays as a safety net for any action added later that still targets Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend: lint-free pytest with coverage
  # ----------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # Run from the workspace root so `from backend.xxx import ...` resolves
    # against the repo layout (the `backend` package is a subdirectory here).
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        env:
          TESTING: 'true'
          ENVIRONMENT: 'development'
          SECRET_KEY: 'ci-test-secret-key-that-is-long-enough-to-pass-32-char-check'
        run: |
          python -m pytest backend/tests/ --no-cov -q

  # ----------------------------------------------------------------------------
  # Frontend: typecheck, unit tests, production build
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ----------------------------------------------------------------------------
  # End-to-end: Playwright against the built frontend
  # ----------------------------------------------------------------------------
  e2e:
    name: Playwright e2e
    # Pinned: `playwright install --with-deps` only knows the system packages
    # of Ubuntu releases its version supports. When ubuntu-latest moved to
    # Ubuntu 26 the install step failed before any test ran. Bump this
    # together with @playwright/test.
    runs-on: ubuntu-24.04
    needs: frontend
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (chromium only on CI)
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test traces/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: frontend/test-results/
          retention-days: 14
